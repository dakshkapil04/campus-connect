server.port=8080

# H2 file database: data survives restarts (stored in ./data). Swap for MySQL later (see README).
spring.datasource.url=jdbc:h2:file:./data/campusdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Lets the frontend read error messages such as "Email already registered"
server.error.include-message=always

# Set JWT_SECRET in the environment for anything beyond local development (32+ characters)
app.jwt.secret=${JWT_SECRET:campus-connect-dev-secret-change-me-please-0123456789}
app.jwt.expiration-ms=86400000
